<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perfect Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
:root{--bg:#16091f;--panel:#241233;--panel2:#321a47;--line:#54306f;--pink:#ff4f8b;--coral:#ff8f5a;--gold:#ffd166;--teal:#4fe3c1;--ink:#fff4fa;--mute:#c9aedd;--bad:#ff6b7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(800px 420px at 50% -100px,#6a1f58 0%,transparent 70%),radial-gradient(500px 300px at 100% 40%,#2c1160 0%,transparent 70%),var(--bg)}
#app{max-width:520px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100dvh}
h1,h2,h3,p{margin:0}
.logo{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;letter-spacing:.5px;line-height:1;background:linear-gradient(90deg,#ff7aa8,#ffb27a);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.btn{background:linear-gradient(180deg,#ff6b9d,#ff4f8b);color:#fff;font-weight:900;font-size:19px;padding:16px 20px;border-radius:16px;width:100%;box-shadow:0 5px 0 #b02560}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #b02560}
.btn.teal{background:linear-gradient(180deg,#6af0d0,#4fe3c1);color:#06332a;box-shadow:0 5px 0 #229b82}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:16px;padding:12px 16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.sub{color:var(--mute);font-size:16px;line-height:1.45;font-weight:700}
.center{text-align:center}
.err{color:var(--bad);min-height:18px;font-size:15px}
label{font-size:12px;letter-spacing:2px;color:var(--mute);font-weight:900}
input[type=text]{width:100%;background:#12081b;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-size:20px;font-weight:800;outline:none}
input[type=text]:focus{border-color:var(--pink)}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
/* top */
.top{display:flex;align-items:center;gap:10px}
.homebtn{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:20px;line-height:1}
.pips{display:flex;gap:4px;flex:1}.pips i{flex:1;height:7px;border-radius:4px;background:var(--panel2)}.pips i.done{background:var(--teal)}.pips i.cur{background:var(--pink)}
.chip{background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:900;white-space:nowrap}
.chip.sc{color:var(--gold)}
.warn{background:#3a1224;border:1.5px solid var(--bad);color:#ffc7cf;border-radius:12px;padding:10px 12px;font-size:14px}
.stage{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:1px;color:var(--mute)}
.stage b{color:var(--gold);letter-spacing:1.5px}
/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 2px}
.collage{display:flex;justify-content:center;align-items:center;height:98px}
.collage img{width:84px;height:84px;object-fit:cover;object-position:50% 20%;border-radius:50%;border:4px solid var(--bg);margin-left:-18px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.collage img:first-child{margin-left:0}
.collage .heart{font-size:40px;margin:0 -8px;z-index:2;filter:drop-shadow(0 4px 8px rgba(255,79,139,.6))}
.seg{display:flex;gap:8px}.seg button{flex:1;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:900;font-size:18px}.seg button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.steps{gap:12px;font-size:16px}.steps div{display:flex;align-items:center;gap:12px}.steps i{width:28px;height:28px;border-radius:50%;background:var(--pink);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;flex:none}
.code{font-family:'Fredoka',sans-serif;font-size:64px;letter-spacing:12px;text-align:center;color:var(--gold);font-weight:700;padding-left:12px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px}
.prow small{background:var(--panel2);border-radius:8px;padding:2px 8px;color:var(--mute);font-size:12px}
.prow.empty{color:var(--mute);border-style:dashed}.prow.off{opacity:.5}
/* client */
.client{display:flex;gap:14px;background:linear-gradient(135deg,#3a1a52,#4a1f4f);border:1.5px solid var(--line);border-radius:22px;padding:12px;align-items:center}
.client img{width:34%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.client small{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:900}
.client h2{font-family:'Fredoka',sans-serif;font-size:34px;font-weight:700;margin:2px 0}
.client p{color:var(--mute);font-size:15px}
.wishes{display:flex;flex-direction:column;gap:6px}
.wish{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:16px}
.wish .ic{font-size:22px;width:30px;text-align:center;flex:none}
.wish small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--mute);font-weight:900}
.wish.mine{border-color:var(--teal);background:#143036}
.wish.mine small{color:var(--teal)}
.tip{background:#2b1a1a;border:1.5px solid var(--coral);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45}
.tip b{color:var(--gold)}
.half{display:flex;flex-wrap:wrap;gap:6px}
.half span{background:#143036;border:1.5px solid var(--teal);color:#bff7e9;border-radius:999px;padding:5px 10px;font-size:14px}
.order{display:flex;flex-direction:column;gap:6px}
.ord{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px}
.ord img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.ord b{flex:1;font-size:17px}
.role{font-size:12px;letter-spacing:1px;border-radius:999px;padding:4px 10px;background:var(--panel2);border:1.5px solid var(--line);font-weight:900;white-space:nowrap}
.role.ans{background:#143036;border-color:var(--teal);color:#bff7e9}
.role.ask{background:#3a1a30;border-color:var(--pink);color:#ffc4da}
/* turn */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);letter-spacing:.5px}
.cand{display:flex;gap:14px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:10px}
.cand img{width:96px;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.cand h2{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:700}
.cand p{color:var(--mute);font-size:14px}
details.help{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
details.help summary{cursor:pointer;color:var(--gold);font-size:15px;font-weight:900}
details.help .wishes{margin-top:10px}
.know{display:flex;flex-direction:column;gap:6px}
.kn{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute)}
.kn .ic{font-size:18px;width:26px;text-align:center}
.kn .m{margin-left:auto;font-size:13px;font-weight:900}
.m.y{color:var(--teal)}.m.n{color:var(--bad)}
.qr{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qr.done{border-color:#2c6a5d}
.qh{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:1.5px;color:var(--gold);font-weight:900}
.qh .ic{font-size:22px;letter-spacing:0}
.qs{font-size:19px;line-height:1.35;font-weight:800}
.blank{display:inline-block;min-width:54px;border-bottom:3px solid var(--gold);height:1em;vertical-align:-3px;margin:0 2px}
.opts4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.o4{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 8px;font-size:15px;font-weight:800;line-height:1.25;text-align:center;min-height:52px}
.o4:active:not(:disabled){transform:scale(.98)}
.o4.ok{background:#12453a;border-color:var(--teal);color:#d6fff3;opacity:1}
.o4.no{background:#4a1a28;border-color:var(--bad);color:#ffd5db;opacity:1}
.o4.dim{opacity:.4}
.fbk{font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fbk .ok{color:var(--teal)}.fbk .no{color:var(--bad)}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:900}
.pill.y{background:#12453a;color:#bff7e9}.pill.n{background:#4a1a28;color:#ffd5db}
.ar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.ar .ic{font-size:30px;width:40px;text-align:center;flex:none}
.ar small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:900;margin-bottom:2px}
.ar .as{font-size:19px;font-weight:800;line-height:1.3}
.ar .as b{color:var(--teal)}
.wait{text-align:center;color:var(--mute);font-size:15px;padding:6px}
/* pick */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--panel);border:2.5px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pc img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.pc b{font-family:'Fredoka',sans-serif;font-size:20px}
.pc.sel{border-color:var(--pink);background:#3a1a30}
.pc.lock{border-color:var(--gold);background:#3a2f12}
.dots{display:flex;flex-wrap:wrap;gap:3px;font-size:12px}
.dots span{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);font-size:12px}
.dots .y{background:#12453a}.dots .n{background:#4a1a28}.dots .u{opacity:.45}
.pc small{color:var(--mute);font-size:12px;font-weight:800}
/* reveal */
.banner{border-radius:18px;padding:16px;text-align:center;font-family:'Fredoka',sans-serif;font-size:26px;font-weight:700}
.banner.b3{background:linear-gradient(135deg,#ff4f8b,#ff8f5a);color:#fff}
.banner.b1{background:#3a2f12;border:2px solid var(--gold);color:var(--gold)}
.banner.b0{background:var(--panel);border:2px solid var(--line);color:var(--mute)}
.rk{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rk.win{border-color:var(--pink);box-shadow:0 0 0 2px rgba(255,79,139,.35)}
.rk .hd{display:flex;align-items:center;gap:10px}
.rk img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.rk .hd b{font-size:18px;flex:1}
.rk .sc{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:700;color:var(--gold)}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--coral))}
.tag{font-size:11px;letter-spacing:1px;border-radius:6px;padding:2px 7px;font-weight:900}
.tag.pk{background:var(--gold);color:#3a2a00}.tag.bst{background:var(--pink);color:#fff}
.rk details summary{cursor:pointer;color:var(--mute);font-size:13px}
.rk .dl{margin-top:6px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rk .dl div{display:flex;gap:8px;align-items:center}
.rk .dl .ic{width:24px;text-align:center}
.stars{text-align:center;font-size:56px;color:var(--gold);letter-spacing:6px}
.big{text-align:center;font-family:'Fredoka',sans-serif;font-size:58px;font-weight:700}
.hist{display:flex;gap:6px;justify-content:center}
.hist span{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700}
.hist .p3{background:var(--pink)}.hist .p1{background:#7a5f1a;color:var(--gold)}.hist .p0{background:var(--panel2);color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(10,3,16,.8);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
#modal .box{background:var(--panel);border:1.5px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:380px;width:100%}
#modal h3{font-family:'Fredoka',sans-serif;font-size:24px}
/* teacher */
.tr{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.tr h3{font-family:'Fredoka',sans-serif;font-size:20px;margin-bottom:6px}
.tr table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.3}
.tr td,.tr th{border-bottom:1px solid var(--line);padding:4px 3px;text-align:left;vertical-align:top}
.tr th{color:var(--gold);font-size:11px}
.tr .w{color:var(--teal)}
</style>
</head>

  const ids={}; playersOf(s).forEach(p=>{ if(p.role) ids[p.role]=p.id; });
  return {pl, t, name, askRole, ansRole, askId:ids[askRole], ansId:ids[ansRole]};
}
function strip(s){ Object.keys(s.players||{}).forEach(id=>{ delete s.players[id].ready; delete s.players[id].lock; }); }

function reduce(cur,a){
  const nx = clone(cur); nx.players = nx.players||{};
  const ps = playersOf(nx);
  switch(a.t){
    case 'start': {
      if(nx.phase!=='lobby') return null;
      if(!(a.by===nx.host || !nx.players[nx.host])) return null;
      if(ps.length!==2 || ps.filter(p=>p.online!==false).length!==2) return null;
      ps.forEach((p,i)=>{ const q=nx.players[p.id]; q.role=i===0?'A':'B'; delete q.ready; delete q.lock; });
      nx.nr = nx.nr||3; nx.phase='intro'; nx.round=0; nx.idx=0; nx.total=0; nx.hist=[]; nx.mis=0; delete nx.res; return nx;
    }
    case 'ready': {
      if((nx.phase!=='intro'&&nx.phase!=='reveal')||!nx.players[a.by]) return null;
      nx.players[a.by].ready=true; return auto(nx,a.now)||nx;
    }
    case 'next': {
      if(nx.phase!=='turn') return null;
      const T=turnInfo(nx); if(a.by!==T.askId) return null;
      if(nx.idx<3) nx.idx++; else { nx.phase='pick'; strip(nx); nx.mis=0; }
      return nx;
    }
    case 'lock': {
      if(nx.phase!=='pick'||!nx.players[a.by]||!(a.i>=0&&a.i<4)) return null;
      nx.players[a.by].lock=a.i;
      const l=ps.map(p=>nx.players[p.id].lock);
      if(l.length===2 && l.every(x=>typeof x==='number')){
        if(l[0]===l[1]){
          const pl=planOf(nx.seed,nx.nr)[nx.round], name=pl.order[l[0]], pts=awardOf(pl,name);
          nx.res={pick:name,pts}; nx.total=(nx.total||0)+pts; nx.hist=nx.hist||[]; nx.hist[nx.round]=pts;
          nx.phase='reveal'; Object.keys(nx.players).forEach(id=>{ delete nx.players[id].ready; delete nx.players[id].lock; });
        } else { Object.keys(nx.players).forEach(id=>{ delete nx.players[id].lock; }); nx.mis=(nx.mis||0)+1; }
      }
      return nx;
    }
    case 'unlock': {
      if(nx.phase!=='pick'||!nx.players[a.by]) return null;
      delete nx.players[a.by].lock; return nx;
    }
  }
  return null;
}
function auto(cur,now){
  const ps = playersOf(cur), both = ps.length===2 && ps.every(p=>p.ready);
  if(!both) return null;
  if(cur.phase==='intro'){ const nx=clone(cur); strip(nx); nx.phase='turn'; nx.idx=0; return nx; }
  if(cur.phase==='reveal'){
    const nx=clone(cur); strip(nx); delete nx.res;
    if(cur.round+1>=cur.nr){ nx.phase='final'; return nx; }
    nx.round=cur.round+1; nx.idx=0; nx.phase='intro'; nx.mis=0; return nx;
  }
  return null;
}

async function go(){
  if(!FB_OK){ homeErr('Cannot connect. Check your wifi and reload the page.'); return; }
  const name = $('#inName').value.trim(); if(!name){ homeErr('Please type your name.'); return; }
  if(SHEET_URL){ const num=($('#inNum')||{value:''}).value.trim(); if(!num){ homeErr('Please type your student number.'); return; } lsSet('pm_num',num); }

      }

    const need=R.total, got=Object.keys(L.rec).length;
    body = `<p class="sub">Ask ${pnE} about <b style="color:var(--gold)">${esc(n)}</b>. ${lv===3?'Make your own questions.':'Read the questions aloud.'} Then <b style="color:var(--gold)">tap what you hear</b>.</p>
      <div class="panel"><label>YOU ALREADY KNOW</label><div class="know">${R.known}</div></div>
      ${R.q}
      <button class="btn" data-act="next" ${got>=need?'':'disabled'}>${got>=need?(S.idx<3?'Next person':'Choose the match'):`Ask all ${need} questions (${got}/${need})`}</button>`;
  } else {
    body = `<p class="sub">${pnE} asks about <b style="color:var(--gold)">${esc(n)}</b>. <b style="color:var(--gold)">Answer in full sentences.</b></p>
      ${R.rowsA}${R.dbRow}${R.help}
      <div class="wait">Waiting for ${pnE} to tap Next…</div>`;
  }
  app.innerHTML = `${hdr()}${stageBar(pl)}
    <div class="qhead"><span>Turn ${T.t+1} of 4</span><span class="role ${iAsk?'ask':'ans'}">${iAsk?'YOU ASK':'YOU ANSWER'}</span></div>
    ${card}${wishes}${body}`;
}

function renderPick(){
  const pl=PLAN()[S.round], mr=myRole(), pt=partner(), pn=pt?pt.name:'partner', mine=me();
  const evaluated = n => { const t=pl.order.indexOf(n); return (t%2===0?pl.first:other(pl.first))===mr; };
  const lockedI = typeof mine.lock==='number' ? mine.lock : null;
  const sel = lockedI!==null ? lockedI : L.sel;
  const cards = pl.order.map((n,i)=>{
    const ev=evaluated(n), cats = ev?[0,1,2,3,4,5,6,7]:KNOW(mr), m=matchesOf(pl,n);
    const sc = ev ? `You found <b style="color:var(--gold)">${m.filter(Boolean).length}/8</b>${pl.decoy===n?' · 💔 ':''}` : `Your facts: <b style="color:var(--gold)">${KNOW(mr).filter(k=>m[k]).length}/6</b> · ask ${esc(pn)}`;
    return `<button class="pc ${i===lockedI?'lock':i===L.sel?'sel':''}" data-act="sel" data-i="${i}" ${lockedI!==null?'disabled':''}><img src="${face(n)}" alt=""><b>${esc(n)}</b><div class="dots">${dots(pl,n,cats)}</div><small>${sc}</small></button>`;
  }).join('');
  const ptLock = pt && typeof pt.lock==='number';
  const status = S.mis>0 && lockedI===null && !ptLock ? `<div class="warn" style="border-color:var(--gold);color:var(--gold);background:#2a2008">You chose different people. Talk and choose again!</div>` : '';
  const btn = lockedI!==null
    ? `<button class="btn ghost" data-act="unlock">Change my choice</button>`
    : `<button class="btn" data-act="lock" ${L.sel===null?'disabled':''}>${L.sel===null?'Tap a person':`Lock in ${esc(pl.order[L.sel])}`}</button>`;
  app.innerHTML = `${hdr()}${stageBar(pl)}
    <div class="client" style="padding:8px"><img src="${face(pl.client)}" alt="" style="width:20%"><div><small>YOUR CLIENT</small><h2 style="font-size:26px">${esc(pl.client)}</h2></div></div>
    <p class="sub center">Talk with ${esc(pn)}. Who is the <b style="color:var(--gold)">perfect match</b> for ${esc(pl.client)}? Choose the same person.</p>
    <details class="help"><summary>${esc(pl.client)}’s wishes</summary><div class="wishes">${wishRows(pl,false)}</div></details>
    ${status}
    <div class="pgrid">${cards}</div>
    <p class="sub center" style="font-size:14px">${lockedI!==null?(ptLock?'':`Waiting for ${esc(pn)} to lock in…`):(ptLock?`${esc(pn)} has chosen. Your turn!`:'')}</p>
    ${btn}`;
}

function detailRows(pl,n){
  const m=matchesOf(pl,n), w=wishOf(pl);
  const rows=CAT.map((c,k)=>`<div><span class="ic">${c.ic[PROF[n][k]]}</span><span>${esc(cap1(sub(n))+' '+optT(k,PROF[n][k],n)+'.')}</span><span style="margin-left:auto;color:var(${m[k]?'--teal':'--bad'})">${m[k]?'✓':'✗'}</span></div>`).join('');
  const dr = pl.decoy ? `<div><span class="ic">${DB_IC}</span><span>${pl.decoy===n?esc(cap1(sub(n))+' has a '+gfOf(n)+'.'):esc(cap1(sub(n))+' doesn’t have a '+gfOf(n)+'.')}</span><span style="margin-left:auto;color:var(${pl.decoy===n?'--bad':'--teal'})">${pl.decoy===n?'−3':'OK'}</span></div>` : '';
  return rows+dr;
}
function renderReveal(){
  const pl=PLAN()[S.round], mine=me(), pt=partner(), rdy=!!mine.ready, res=S.res||{pick:null,pts:0};
  const sorted=pl.order.slice().sort((a,b)=>finalOf(pl,b)-finalOf(pl,a));
  const best=sorted[0];
  const bn = res.pts===3?`<div class="banner b3">💘 PERFECT MATCH! +3</div>`:res.pts===1?`<div class="banner b1">So close! +1</div>`:`<div class="banner b0">Not this time. +0</div>`;
  const rows = sorted.map(n=>{ const f=finalOf(pl,n), raw=rawOf(pl,n);
    return `<div class="rk ${n===best?'win':''}"><div class="hd"><img src="${face(n)}" alt=""><b>${esc(n)}</b>${n===res.pick?'<span class="tag pk">YOUR PICK</span>':''}${n===best?'<span class="tag bst">BEST</span>':''}<span class="sc">${f}/8</span></div>
      <div class="bar"><i style="width:${Math.max(0,f)/8*100}%"></i></div>
      <details ${n===best||n===res.pick?'open':''}><summary>${raw} wishes${pl.decoy===n?' · has a '+gfOf(n)+' (−3)':''}</summary><div class="dl">${detailRows(pl,n)}</div></details></div>`; }).join('');
  const last = S.round+1>=S.nr;
  app.innerHTML = `${hdr()}${stageBar(pl)}
    ${bn}
    <p class="sub center">${esc(pl.client)}’s best match is <b style="color:var(--gold)">${esc(best)}</b>.</p>
    ${rows}
    <button class="btn" data-act="ready" ${rdy?'disabled':''}>${rdy?`Waiting for ${esc(pt?pt.name:'partner')}…`:(last?'Finish':'Next round')}</button>`;
}
function renderFinal(){
  logResult();
  const max=S.nr*3, total=S.total||0, pct=total/max, stars=pct>=.85?3:pct>=.6?2:1;
  const msg=stars===3?'PERFECT MATCHMAKERS!':stars===2?'GREAT WORK!':'GOOD TRY!';
  const ps=playersOf(S);
  const hist=(S.hist||[]).map(p=>`<span class="p${p}">${p}</span>`).join('');
  app.innerHTML = `<div class="hero"><div class="logo" style="font-size:34px">MISSION<br>COMPLETE</div></div>
    <div class="stars">${'★'.repeat(stars)}<span style="opacity:.25">${'★'.repeat(3-stars)}</span></div>
    <div class="big">${total}<span style="font-size:26px;color:var(--mute)"> / ${max}</span></div>
    <p class="center" style="font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;color:var(--pink)">${msg}</p>
    <div class="hist">${hist}</div>
    <p class="sub center">${ps.map(p=>esc(p.name)).join(' + ')}</p>
    <p class="sub center">Tell your partner: <b style="color:var(--gold)">“My best match is … . He / She … and … .”</b></p>
    <button class="btn" data-act="again">Play again</button>`;
}

/* ============ TEACHER ============ */
function renderTeacher(){
  const rs = RD.map((d,i)=>{
    const pl={client:d.c,decoy:d.d||null};
    const w=WISH[d.c];
    const head=`<tr><th></th>${d.k.map(n=>`<th>${n}</th>`).join('')}</tr>`;
    const body=CAT.map((c,k)=>`<tr><td class="w">${c.lab}<br>${c.ic[w[k]]} ${esc(wishT(k,w[k]))}</td>${d.k.map(n=>{ const ok=PROF[n][k]===w[k]; return `<td style="color:var(${ok?'--teal':'--ink'})">${ok?'✓ ':''}${esc(optT(k,PROF[n][k],n))}</td>`; }).join('')}</tr>`).join('');
    const sc=`<tr><td class="w">SCORE</td>${d.k.map(n=>{ const f=finalOf(pl,n); const best=Math.max(...d.k.map(x=>finalOf(pl,x))); return `<td><b style="color:var(--${f===best?'gold':'mute'})">${f}/8${f===best?' ★ BEST':''}</b>${d.d===n?'<br>💔 has a '+gfOf(n)+' (−3)':''}</td>`; }).join('')}</tr>`;
    return `<div class="tr"><h3>Set ${i+1}: client ${d.c}</h3><table>${head}${body}${sc}</table></div>`;
  }).join('');
  app.innerHTML = `<div class="hero"><div class="logo" style="font-size:30px">TEACHER KEY</div><p class="sub center">Perfect Match · 6 sets. Default 3 rounds = sets 1, 2, 5 (about 12–15 min). 4 rounds = sets 1, 2, 3, 6. 5 = 1, 2, 3, 4, 6. 6 = all.</p></div>
    <div class="panel"><p class="sub" style="font-size:15px;line-height:1.5"><b style="color:var(--gold)">Setup:</b> one student taps <b>Create</b> and shows the 4-letter code. The partner taps <b>Join</b> and types it. Pairs only. The game is 3 rounds by default (about 12–15 minutes). Add <b>?r=4</b>, <b>?r=5</b> or <b>?r=6</b> to the link for a longer game.<br>
    <b style="color:var(--gold)">Flow:</b> each round has a client with 8 wishes (both see them) and 4 candidates. Each partner sees 6 of the 8 facts about every candidate. Partner A does not see Music and Day off; Partner B does not see Transport and Home. In each of 4 turns, one student asks about one candidate (2 questions, tapping what they hear) and the other answers from their screen. Then both choose the best match and lock in the same person.<br>
    <b style="color:var(--gold)">Points:</b> best match +3, second best +1. The last round of the 3-round game (and rounds 4–6 of longer games) has a hidden fact: “Does he/she have a girlfriend/boyfriend?” One candidate says yes (−3 points), so the obvious favourite may not be the best.<br>
    <b style="color:var(--gold)">Stages:</b> 1 = full questions and answer sentences; 2 = blank for does/do in the question, answers from base verbs (“have a car” → “She has a car”); 3 = pictures only, own words (a help box shows the sentences).<br>
    Open this page with <b>#teacher</b> at the end of the link.</p></div>
    ${rs}`;
}

/* ============ MODAL ============ */
function showHome(){
  if($('#modal')) return;
  const m=document.createElement('div'); m.id='modal';
  m.innerHTML=`<div class="box"><h3>Go to the menu?</h3><p class="sub">Your partner will wait for you. Tap “Back to my game” on the menu to come back.</p><button class="btn" data-act="homeStay">Keep playing</button><button class="btn ghost" data-act="homeGo">Go to menu</button></div>`;
  document.body.appendChild(m);
}
function closeModal(){ const m=$('#modal'); if(m) m.remove(); }

/* ============ EVENTS ============ */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(b){ onAct(b); return; }
});
function onAct(b){
  const a=b.dataset.act;
  if(a==='tab'){ L.tab=b.dataset.v; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); $('#joinBox').style.display=L.tab==='join'?'block':'none'; $('#goBtn').textContent=L.tab==='join'?'Join room':'Create room'; $('#tabHelp').textContent=L.tab==='join'?'Type the 4 letters from your partner’s screen.':'You get a room code. Show it to your partner.'; homeErr(''); return; }
  if(a==='go'){ go(); return; }
  if(a==='resume'){ resumeSaved().then(ok=>{ if(!ok) renderHome('That game is not there any more.'); }); return; }
  if(a==='forget'){ lsDel(SESSION_KEY); renderHome(''); return; }
  if(a==='leave'){ leaveRoom(); return; }
  if(a==='again'){ leaveRoom(); return; }
  if(a==='home'){ showHome(); return; }
  if(a==='homeStay'){ closeModal(); return; }
  if(a==='homeGo'){ goMenu(); return; }
  if(a==='start'){ act({t:'start'}); return; }
  if(a==='ready'){ act({t:'ready'}); return; }
  if(a==='next'){ act({t:'next'}); return; }
  if(a==='rec'){ const c=+b.dataset.c, v=+b.dataset.v; if(L.rec[c]===undefined){ L.rec[c]=v; { const T=turnInfo(S); const truth=c===8?(T.pl.decoy===T.name?1:0):PROF[T.name][c]; addStat(truth===v); } const y=window.scrollY; render(); window.scrollTo(0,y); } return; }
  if(a==='sel'){ L.sel=+b.dataset.i; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(a==='lock'){ if(L.sel!==null) act({t:'lock',i:L.sel}); return; }
  if(a==='unlock'){ act({t:'unlock'}); return; }
}

/* ============ START ============ */
async function boot(){
  if(location.hash==='#teacher'){ renderTeacher(); return; }
  renderHome('');
  if(await resumeSaved()) return;
}
window.addEventListener('hashchange',()=>location.reload());
boot();

</script>
</body>
</html>
