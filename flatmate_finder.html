<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flatmate Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
:root{--bg:#06202c;--panel:#0e3144;--panel2:#164559;--line:#2c6a85;--teal:#3de0c0;--gold:#ffd166;--coral:#ff7a59;--ink:#f0fbff;--mute:#9fcbdc;--bad:#ff6b7a;--good:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(800px 420px at 50% -100px,#0d6f78 0%,transparent 70%),radial-gradient(500px 300px at 100% 40%,#0e3a6b 0%,transparent 70%),var(--bg)}
#app{max-width:520px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100dvh}
h1,h2,h3,p{margin:0}
.logo{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;letter-spacing:.5px;line-height:1;background:linear-gradient(90deg,#6af0d0,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.btn{background:linear-gradient(180deg,#6af0d0,#3de0c0);color:#04332a;font-weight:900;font-size:19px;padding:16px 20px;border-radius:16px;width:100%;box-shadow:0 5px 0 #1f9b82}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #1f9b82}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#ffd166);color:#3a2a00;box-shadow:0 5px 0 #b8902c}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:16px;padding:12px 16px}
.btn.red{background:linear-gradient(180deg,#ff8b98,#ff6b7a);color:#3a0710;box-shadow:0 5px 0 #b0384a}
.row{display:flex;gap:10px}.row>*{flex:1}
.sub{color:var(--mute);font-size:16px;line-height:1.45;font-weight:700}
.center{text-align:center}
.err{color:var(--bad);min-height:18px;font-size:15px}
label{font-size:12px;letter-spacing:2px;color:var(--mute);font-weight:900}
input[type=text],input[type=tel]{width:100%;background:#041822;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-size:20px;font-weight:800;outline:none}
input:focus{border-color:var(--teal)}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:4px;flex:1}.pips i{flex:1;height:7px;border-radius:4px;background:var(--panel2)}.pips i.done{background:var(--teal)}.pips i.cur{background:var(--gold)}
.chip{background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:900;white-space:nowrap}
.chip.sc{color:var(--gold)}
.stage{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:1px;color:var(--mute)}
.stage b{color:var(--gold);letter-spacing:1.5px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 2px}
.hero .em{font-size:54px;line-height:1}
.seg{display:flex;gap:8px}.seg button{flex:1;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:900;font-size:18px}.seg button.on{background:var(--teal);border-color:var(--teal);color:#04332a}
.steps{gap:12px;font-size:16px}.steps div{display:flex;align-items:center;gap:12px}.steps i{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#04332a;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;flex:none}
.steps span{flex:1}
.code{font-family:'Fredoka',sans-serif;font-size:64px;letter-spacing:12px;text-align:center;color:var(--gold);font-weight:700;padding-left:12px}
.tcard{background:linear-gradient(135deg,#0e4a5c,#124a6e);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center}
.tcard .ic{font-size:46px;line-height:1}
.tcard small{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:900}
.tcard .qq{font-size:20px;font-weight:800;line-height:1.3;margin-top:2px}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.opt .ol{font-size:18px;font-weight:800}
.rt{display:flex;gap:6px}
.rt button{flex:1;padding:8px 4px;border-radius:12px;font-size:13px;font-weight:900;border:2px solid var(--line);background:var(--panel2);line-height:1.25;color:var(--mute)}
.rt button span{display:block;font-size:20px;line-height:1.1}
.rt .g.on{background:#12503c;border-color:var(--good);color:#d6fff0}
.rt .y.on{background:#5a4a12;border-color:var(--gold);color:#fff1c2}
.rt .r.on{background:#5a1d2a;border-color:var(--bad);color:#ffd5db}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:800;text-align:left}
.ch.on{background:#12453a;border-color:var(--teal);color:#d6fff3}
.badge{display:inline-block;border-radius:999px;padding:4px 12px;font-size:12px;letter-spacing:1px;font-weight:900;background:var(--panel2);border:1.5px solid var(--line);color:var(--gold)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:19px;text-align:left;width:100%}
.prow small{margin-left:auto;background:var(--panel2);border-radius:8px;padding:2px 8px;color:var(--mute);font-size:12px}
.prow.sel{border-color:var(--teal);background:#0f4a46}
.prow.off{opacity:.5}
.frame{background:#2a2a14;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.5}
.frame b{color:var(--gold)}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:900;font-size:17px}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#3a2a00}
.qr{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;width:100%;text-align:left}
.qr .ic{font-size:28px;width:38px;text-align:center;flex:none}
.qr small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:900;margin-bottom:2px}
.qr .qs{font-size:19px;font-weight:800;line-height:1.35}
.qr .tick{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.qr.done{border-color:#2c7a68;background:#0d3a3a}
.qr.done .tick{background:var(--teal);border-color:var(--teal);color:#04332a}
.hint{color:var(--gold);font-weight:800}
.blank{display:inline-block;min-width:50px;border-bottom:3px solid var(--gold);height:1em;vertical-align:-3px;margin:0 2px}
.who{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.who small{font-size:12px;letter-spacing:1.5px;color:var(--gold);font-weight:900}
.who b{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:700}
.big{text-align:center;font-family:'Fredoka',sans-serif;font-size:72px;font-weight:700;line-height:1}
.big.pos{color:var(--good)}.big.neg{color:var(--bad)}.big.zero{color:var(--gold)}
.banner{border-radius:18px;padding:14px;text-align:center;font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;background:var(--panel);border:2px solid var(--line)}
.banner.top{background:linear-gradient(135deg,#1fae8f,#3de0c0);color:#04332a;border-color:var(--teal)}
.rw{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.rw .ic{font-size:24px;width:32px;text-align:center;flex:none}
.rw small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--mute);font-weight:900}
.rw .v{font-size:17px;font-weight:800}
.rw .pt{margin-left:auto;font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;width:38px;text-align:center;border-radius:10px;padding:4px 0;flex:none}
.pt.g{background:#12503c;color:#d6fff0}.pt.y{background:#5a4a12;color:#fff1c2}.pt.r{background:#5a1d2a;color:#ffd5db}
.cc{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cc.best{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,209,102,.35)}
.cc .hd{display:flex;align-items:center;gap:10px}
.cc .hd b{flex:1;font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700}
.cc .sc{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:700}
.cc .sc.pos{color:var(--good)}.cc .sc.neg{color:var(--bad)}.cc .sc.zero{color:var(--gold)}
.dots{display:flex;gap:4px}
.dots span{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.dots .g{background:#12503c}.dots .y{background:#5a4a12}.dots .r{background:#5a1d2a}
.tagb{font-size:11px;letter-spacing:1px;border-radius:6px;padding:2px 7px;font-weight:900;background:var(--gold);color:#3a2a00}
.say{display:flex;flex-direction:column;gap:6px;font-size:18px;line-height:1.4}
.say div{background:var(--panel);border-radius:12px;padding:8px 12px;border-left:5px solid var(--good)}
.say .no{border-left-color:var(--bad)}
.legend{display:flex;gap:10px;font-size:13px;color:var(--mute);justify-content:center}
#modal{position:fixed;inset:0;background:rgba(2,12,18,.8);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
#modal .box{background:var(--panel);border:1.5px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:380px;width:100%}
#modal h3{font-family:'Fredoka',sans-serif;font-size:24px}
.tr{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.tr h3{font-family:'Fredoka',sans-serif;font-size:20px;margin-bottom:6px}
.tr table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.3}
.tr td,.tr th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:left;vertical-align:top}
.tr th{color:var(--gold);font-size:11px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ UTIL ============ */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap1 = s => s.charAt(0).toUpperCase()+s.slice(1);
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
const BL = '<span class="blank"></span>';
const hintOf = w => ' <span class="hint">('+w+')</span>';

/* ============ CONTENT ============ */
// q: question template. {Do}/{do} = do/does, {s} = you / she / he, {v} = base verb.
// o[].t: answer template. {S}/{s}/{my} = subject words, {v} = main verb, {nv} = negative verb (don't have), {g} = go/goes, {dont} = don't/doesn't.
const TOP = [
 {lab:'Cleaning', ic:'🧹', v:['clean','cleans'], q:'How often {do} {s} {v} the kitchen or living room?', o:[
   {lab:'every day', t:'{S} {v} the kitchen or living room every day.'},
   {lab:'a few times a week', t:'{S} {v} the kitchen or living room a few times a week.'},
   {lab:'about once a week', t:'{S} {v} the kitchen or living room about once a week.'},
   {lab:'about twice a month', t:'{S} {v} the kitchen or living room about twice a month.'}]},
 {lab:'Bedtime', ic:'🌙', v:['go','goes'], q:'When {do} {s} {v} to bed?', o:[
   {lab:'before 11 pm', t:'{S} {v} to bed before 11 pm.'},
   {lab:'at about 12 am', t:'{S} {v} to bed at about 12 am.'},
   {lab:'at about 1 am', t:'{S} {v} to bed at about 1 am.'},
   {lab:'after 1:30 am', t:'{S} {v} to bed after 1:30 am.'}]},
 {lab:'Shower', ic:'🚿', v:['take','takes'], q:'How long {do} {s} {v} a shower?', o:[
   {lab:'10 min.', t:'{S} {v} a 10-minute shower.'},
   {lab:'15 min.', t:'{S} {v} a 15-minute shower.'},
   {lab:'20 min.', t:'{S} {v} a 20-minute shower.'},
   {lab:'over 25 min.', t:'{S} {v} a shower for over 25 minutes.'}]},
 {lab:'Dishes', ic:'🍽️', v:['wash','washes'], q:'When {do} {s} {v} the dishes?', o:[
   {lab:'right after eating', t:'{S} {v} the dishes right after eating.'},
   {lab:'before I go to bed', t:'{S} {v} the dishes before {s} {g} to bed.'},
   {lab:'the next day', t:'{S} {v} the dishes the next day.'},
   {lab:'never', t:'{S} never {v} the dishes.'}]},
 {lab:'Friends', ic:'🧑‍🤝‍🧑', v:['have','has'], q:'How often {do} {s} {v} friends over?', o:[
   {lab:'often', t:'{S} often {v} friends over.'},
   {lab:'sometimes', t:'{S} sometimes {v} friends over.'},
   {lab:'rarely', t:'{S} rarely {v} friends over.'},
   {lab:'never', t:'{S} never {v} friends over.'}]},
 {lab:'Music', ic:'🎧', v:['listen','listens'], q:'How {do} {s} {v} to music?', o:[
   {lab:'with headphones', t:'{S} {v} to music with headphones.'},
   {lab:'on speakers', t:'{S} {v} to music on speakers.'},
   {lab:'I play an instrument', v:['play','plays'], t:'{S} {v} an instrument.'},
   {lab:'I don’t listen to music', t:'{S} {nv} to music.'}]},
 {lab:'Food', ic:'🍙', v:['share','shares'], q:'{Do} {s} {v} food?', o:[
   {lab:'I share everything', t:'{S} {v} everything.'},
   {lab:'I share snacks only', t:'{S} {v} snacks only.'},
   {lab:'I label my food', v:['label','labels'], t:'{S} {v} {my} food.'},
   {lab:'I never share', t:'{S} never {v} food.'}]},
 {lab:'Pets', ic:'🐾', v:['have','has'], q:'{Do} {s} {v} a pet?', o:[
   {lab:'I have a big pet', t:'Yes, {s} {v} a big pet.'},
   {lab:'I have a small pet', t:'Yes, {s} {v} a small pet.'},
   {lab:'I want to buy a pet', v:['want','wants'], t:'No, {s} {dont}. {S} {v} to buy a pet.'},
   {lab:'I don’t have a pet', t:'No, {s} {nv} a pet.'}]}
];
const NT = TOP.length;
const LVINFO = {
  1:{name:'GUIDED', how:'Read the questions and the answers.'},
  2:{name:'LESS HELP', how:'Fill in the blanks. You get less help.'},
  3:{name:'NEW: HE / SHE', how:'He / she grammar. Use the help in ( ).'}
};

function person(sex,p){
  if(p===1) return {S:'I',s:'I',my:'my',dont:'don’t',i:0,g:'go',d:'do',q:'you'};
  return sex==='f' ? {S:'She',s:'she',my:'her',dont:'doesn’t',i:1,g:'goes',d:'does',q:'she'}
                   : {S:'He',s:'he',my:'his',dont:'doesn’t',i:1,g:'goes',d:'does',q:'he'};
}
// answer sentence. P = person(), lv = 1 full, 2/3 = blank + (base verb)
function ansS(t,o,P,lv){
  const T=TOP[t], O=T.o[o], vb=O.v||T.v, base=vb[0];
  const vv = lv===1 ? vb[P.i] : BL+hintOf(base);
  const nv = lv===1 ? P.dont+' '+base : BL+hintOf('not '+base);
  return O.t.replace('{nv}',nv).replace('{v}',vv).replace(/\{S\}/g,P.S).replace(/\{s\}/g,P.s).replace(/\{my\}/g,P.my).replace('{dont}',P.dont).replace('{g}',P.g);
}
// question sentence. s = word for the person asked about, d = do/does
function quesS(t,s,d,lv){
  const T=TOP[t], base=T.v[0];
  const dd = lv===1 ? d : (lv===2 ? BL : BL+hintOf('do'));
  const Dd = lv===1 ? cap1(d) : dd;
  const vv = lv===1 ? base : (lv===2 ? BL : BL+hintOf(base));
  return T.q.replace('{Do}',Dd).replace('{do}',dd).replace('{s}',s).replace('{v}',vv);
}
const LVR = {1:1,2:2,3:3};

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBrsLESE52ZBtE6iXPyO-DU3UstKfcxX48",
  authDomain: "frequency-adverbs.firebaseapp.com",
  databaseURL: "https://frequency-adverbs-default-rtdb.firebaseio.com",
  projectId: "frequency-adverbs",
  storageBucket: "frequency-adverbs.firebasestorage.app",
  messagingSenderId: "8272563124",
  appId: "1:8272563124:web:537beb3582b7a36ef4c0e1",
  measurementId: "G-D7W5WDM9R6"
};
let db=null, FB_OK=false;
try{ firebase.initializeApp(firebaseConfig); db=firebase.database(); FB_OK=true; }catch(e){ console.error('Firebase init failed',e); }
const ROOT='flatmate';
// Paste your Google Apps Script web app URL between the quotes to log results to a Google Sheet (leave empty to turn logging off).
const SHEET_URL = '';
const TS=()=>firebase.database.ServerValue.TIMESTAMP;

/* ============ STATE ============ */
const qp = new URLSearchParams(location.search);
const PID = qp.get('pid') || lsGet('fm_pid') || ('p'+Math.random().toString(36).slice(2,9));
if(!qp.get('pid')) lsSet('fm_pid',PID);
const SESS = 'fm_room_'+PID;
let CODE=null, ROOMREF=null, ROOMCB=null, PL={}, ME=null;
let UI={tab:'q', asked:{}, sel:null, sex:lsGet('fm_sex')||'', err:''};

const ready = p => !!p && typeof p.ans==='string' && /^[0-3]{8}$/.test(p.ans);
const rv = ch => ch==='g'?1:(ch==='r'?-1:0);
function ratingAt(t,o){ return (ME.ideal||'y'.repeat(32)).charAt(t*4+o)||'y'; }
function pointsOf(c){ if(!ready(c)) return 0; let s=0; for(let t=0;t<NT;t++) s+=rv(ratingAt(t,+c.ans.charAt(t))); return s; }
function labelOf(p){ return p>=6?'Dream flatmate!':(p>=3?'Good flatmate':(p>=0?'Maybe':'Different style')); }
const sgn = n => n>0?'pos':(n<0?'neg':'zero');
const fmt = n => (n>0?'+':'')+n;
const cand = r => { const id=ME&&ME['c'+r]; return id&&PL[id]?PL[id]:null; };
function saveMe(patch){
  Object.keys(patch).forEach(k=>{ ME[k]=patch[k]; });
  PL[PID]=ME;
  if(ROOMREF) ROOMREF.child('p/'+PID).update(patch).catch(e=>console.error(e));
}
function setAt(str,i,ch){ return str.substring(0,i)+ch+str.substring(i+1); }

/* ============ SHEET LOG ============ */
function postSheet(data){
  try{
    const ifr=document.createElement('iframe'); ifr.name='lg'+Date.now(); ifr.style.display='none';
    const f=document.createElement('form'); f.method='POST'; f.action=SHEET_URL; f.target=ifr.name; f.style.display='none';
    const i=document.createElement('input'); i.type='hidden'; i.name='payload'; i.value=JSON.stringify(data); f.appendChild(i);
    document.body.appendChild(ifr); document.body.appendChild(f); f.submit();
    setTimeout(()=>{ ifr.remove(); f.remove(); },20000);
  }catch(e){ console.error('log failed',e); }
}
function logResult(){
  if(!SHEET_URL||!ME||ME.ph!=='final') return;
  const k='fm_logged_'+CODE+'_'+PID; if(lsGet(k)) return; lsSet(k,'1');
  const list=[1,2,3].map(r=>({r,c:cand(r)})).filter(x=>x.c).map(x=>({name:x.c.name,pts:pointsOf(x.c)}));
  const best=list.slice().sort((a,b)=>b.pts-a.pts)[0];
  const avg=list.length?Math.round(10*list.reduce((s,x)=>s+x.pts,0)/list.length)/10:0;
  postSheet({game:'Flatmate', ts:new Date().toISOString(), room:CODE, name:ME.name||'', studentNumber:ME.num||'',
    survey:ME.ans||'', interviews:list.map(x=>x.name+' ('+x.pts+')').join(', '), avgScore:avg, bestName:best?best.name:'', bestScore:best?best.pts:''});
}

/* ============ JOIN / ENTER ============ */
function homeErr(m){ UI.err=m||''; const e=$('#err'); if(e) e.textContent=UI.err; }
async function joinClass(){
  if(!FB_OK){ homeErr('No connection. Check your internet.'); return; }
  const name=($('#inName').value||'').trim().replace(/\s+/g,' ');
  const code=($('#inCode').value||'').trim().toUpperCase();
  const num=$('#inNum')?($('#inNum').value||'').trim():'';
  if(!name){ homeErr('Type your name.'); return; }
  if(!UI.sex){ homeErr('Choose she or he.'); return; }
  if($('#inNum')&&!num){ homeErr('Type your student number.'); return; }
  if(code.length!==4){ homeErr('Type the 4-letter class code.'); return; }
  $('#goBtn').disabled=true;
  try{
    const sn=await db.ref(ROOT+'/'+code).once('value');
    const v=sn.val();
    if(!v||!v.created){ homeErr('There is no class with this code.'); $('#goBtn').disabled=false; return; }
    const players=v.p||{};
    const taken=Object.keys(players).some(k=>k!==PID&&String(players[k].name||'').toLowerCase()===name.toLowerCase());
    if(taken){ homeErr('This name is used. Add a letter (for example: Aiko K).'); $('#goBtn').disabled=false; return; }
    lsSet('fm_name',name); lsSet('fm_sex',UI.sex); if(num) lsSet('fm_num',num);
    if(!players[PID]){
      const me0={name, sex:UI.sex, num:num, ideal:'y'.repeat(32), ans:'--------', ph:'ideal', ti:0, rd:1, step:'intro', ts:TS()};
      await db.ref(ROOT+'/'+code+'/p/'+PID).set(me0);
    }
    enterClass(code);
  }catch(e){ console.error(e); homeErr('Could not join. Try again.'); $('#goBtn').disabled=false; }
}
function leaveSub(){ if(ROOMREF&&ROOMCB){ ROOMREF.off('value',ROOMCB); } ROOMREF=null; ROOMCB=null; }
function enterClass(code){
  leaveSub(); CODE=code; lsSet(SESS,code); ROOMREF=db.ref(ROOT+'/'+code); let first=true;
  ROOMCB=ROOMREF.on('value',sn=>{
    const v=sn.val();
    if(!v||!v.created){ goHome('This class was closed.'); return; }
    PL=v.p||{};
    if(first){ first=false; ME=PL[PID]; if(!ME){ goHome('Please join again.'); return; } ME.sex=ME.sex||'f'; render(); return; }
    if(PL[PID]) PL[PID]=ME; else { PL[PID]=ME; }
    onPlayers();
  });
}
function goHome(msg){ leaveSub(); lsDel(SESS); CODE=null; ME=null; PL={}; closeModal(); renderHome(msg||''); window.scrollTo(0,0); }
async function resumeSaved(){
  const code=lsGet(SESS); if(!code||!FB_OK) return false;
  try{ const sn=await db.ref(ROOT+'/'+code).once('value'); const v=sn.val(); if(v&&v.created&&v.p&&v.p[PID]){ enterClass(code); return true; } lsDel(SESS); }catch(e){}

}

function render(){
  if(!ME){ renderHome(''); return; }
  if(ME.ph==='ideal') renderIdea();
  else if(ME.ph==='about') renderAbout();
  else if(ME.ph==='round'){
    const s=ME.step;
    if(s==='intro') renderIntro(); else if(s==='pick') renderPick(); else if(s==='talk') renderTalk(); else renderResult();
  } else renderFinal();
  const pb=$('#psearch'); if(pb) pb.addEventListener('input',applyFilter);
}

/* ============ TEACHER ============ */
function stageLabel(p){
  if(p.ph==='ideal') return 'Ideal flatmate '+((p.ti||0)+1)+'/8';
  if(p.ph==='about') return 'About me '+((p.ti||0)+1)+'/8';
  if(p.ph==='round'){ const m={intro:'start',pick:'choosing a name',talk:'interview',result:'points'}; return 'Round '+p.rd+' · '+(m[p.step]||''); }
  return '✅ Done';
}
let TCODE=null, TREF=null, TCB=null, TDATA=null;
function tCode(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }
async function tCreate(){
  if(!FB_OK) return;
  for(let i=0;i<10;i++){
    const c=tCode(); const sn=await db.ref(ROOT+'/'+c).once('value');
    if(!sn.exists()){ await db.ref(ROOT+'/'+c+'/created').set(TS()); lsSet('fm_tcode',c); tWatch(c); return; }
  }
}
function tWatch(code){
  if(TREF&&TCB) TREF.off('value',TCB);
  TCODE=code; TREF=db.ref(ROOT+'/'+code); TCB=TREF.on('value',sn=>{ TDATA=sn.val(); renderTeacher(); });
}
function renderTeacher(){
  if(!TCODE){ const c=lsGet('fm_tcode'); if(c&&FB_OK){ tWatch(c); } }
  if(!TCODE||!TDATA||!TDATA.created){
    app.innerHTML=`<div class="hero"><div class="em">👩‍🏫</div><h1 class="logo" style="font-size:38px">Teacher</h1></div>
    <div class="panel"><p class="sub">Make a class code. Students type it to join.</p><button class="btn" data-act="tNew">New class</button>
    <div><label>OR OPEN A CLASS CODE</label><input id="tIn" type="text" maxlength="4" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:8px;text-align:center"></div>
    <button class="btn ghost" data-act="tOpen">Open</button></div>`;
    return;
  }
  const p=TDATA.p||{}; const ids=Object.keys(p).sort((a,b)=>String(p[a].name).localeCompare(String(p[b].name)));
  const done=ids.filter(k=>p[k].ph==='final').length;
  const link=location.origin&&location.origin!=='null'?location.href.split('#')[0].split('?')[0]+'?c='+TCODE:'';
  const rows=ids.map(k=>{ const q=p[k]; const cs=[1,2,3].map(r=>q['c'+r]&&p[q['c'+r]]?p[q['c'+r]].name:'').filter(Boolean).join(', ');
    return `<tr><td>${esc(q.name)}</td><td>${esc(stageLabel(q))}</td><td>${esc(cs)}</td></tr>`; }).join('');
  app.innerHTML=`<div class="hero"><h1 class="logo" style="font-size:34px">Class code</h1></div>
  <div class="code">${esc(TCODE)}</div>
  ${link?`<p class="sub center" style="word-break:break-all">${esc(link)}</p>`:''}
  <div class="panel"><p class="sub center"><b style="color:var(--gold)">${ids.length}</b> students joined · <b style="color:var(--teal)">${done}</b> finished</p></div>
  <div class="tr"><h3>Students</h3><table><tr><th>Name</th><th>Where</th><th>Candidates</th></tr>${rows||'<tr><td colspan="3">Nobody yet.</td></tr>'}</table></div>
  <button class="btn red" data-act="tDelAsk">Delete this class</button>
  <button class="btn ghost" data-act="tClose">New class code</button>`;

/* ============ EVENTS ============ */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(b) onAct(b);
});
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
function onAct(b){
  const a=b.dataset.act;
  if(a==='sex'){ UI.sex=b.dataset.v; document.querySelectorAll('#sexSeg button').forEach(x=>x.classList.toggle('on',x===b)); return; }
  if(a==='go'){ joinClass(); return; }
  if(a==='resume'){ resumeSaved().then(ok=>{ if(!ok) renderHome('That class is not there any more.'); }); return; }
  if(a==='forget'){ lsDel(SESS); renderHome(''); return; }
  if(a==='leave'){ goHome(''); return; }
  if(a==='rate'){ const o=+b.dataset.o; const i=ME.ti*4+o; saveMe({ideal:setAt(ME.ideal,i,b.dataset.v)}); keepScroll(render); return; }
  if(a==='back'){
    if(ME.ph==='ideal'&&ME.ti>0) saveMe({ti:ME.ti-1});
    else if(ME.ph==='about'){ if(ME.ti>0) saveMe({ti:ME.ti-1}); else saveMe({ph:'ideal',ti:NT-1}); }
    render(); window.scrollTo(0,0); return;
  }
  if(a==='nextIdeal'){ if(ME.ti<NT-1) saveMe({ti:ME.ti+1}); else saveMe({ph:'about',ti:0}); render(); window.scrollTo(0,0); return; }
  if(a==='pick'){ const t=ME.ti; saveMe({ans:setAt(ME.ans,t,String(+b.dataset.o))}); keepScroll(render); return; }
  if(a==='nextAbout'){ if(ME.ti<NT-1) saveMe({ti:ME.ti+1}); else saveMe({ph:'round',rd:1,step:'intro',ti:0}); render(); window.scrollTo(0,0); return; }
  if(a==='startRound'){ saveMe({step:'pick'}); render(); window.scrollTo(0,0); return; }
  if(a==='selp'){ UI.sel=b.dataset.id; document.querySelectorAll('#plist .prow').forEach(x=>x.classList.toggle('sel',x===b)); const ok=$('#pickOk'); if(ok){ ok.disabled=false; ok.textContent='Choose '+(PL[UI.sel]?PL[UI.sel].name:''); } return; }
  if(a==='pickOk'){ if(!UI.sel) return; const patch={step:'talk'}; patch['c'+ME.rd]=UI.sel; UI.tab='q'; saveMe(patch); render(); window.scrollTo(0,0); return; }
  if(a==='tab'){ UI.tab=b.dataset.v; keepScroll(render); return; }
  if(a==='tick'){ const key='r'+ME.rd; UI.asked[key]=UI.asked[key]||{}; const t=b.dataset.t; UI.asked[key][t]=!UI.asked[key][t]; keepScroll(render); return; }
  if(a==='changeName'){ saveMe({step:'pick'}); render(); window.scrollTo(0,0); return; }
  if(a==='done'){ saveMe({step:'result'}); render(); window.scrollTo(0,0); return; }
  if(a==='nextRound'){ if(ME.rd<3){ UI.tab='q'; saveMe({rd:ME.rd+1,step:'intro'}); } else saveMe({ph:'final'}); render(); window.scrollTo(0,0); return; }
  if(a==='back2'){ saveMe({ph:'round',rd:3,step:'result'}); render(); window.scrollTo(0,0); return; }
  if(a==='tNew'){ tCreate(); return; }
  if(a==='tOpen'){ const c=(($('#tIn')||{}).value||'').trim().toUpperCase(); if(c.length===4){ lsSet('fm_tcode',c); tWatch(c); } return; }
  if(a==='tClose'){ lsDel('fm_tcode'); if(TREF&&TCB) TREF.off('value',TCB); TCODE=null; TDATA=null; renderTeacher(); return; }
  if(a==='tDelAsk'){ showModal(`<h3>Delete this class?</h3><p class="sub">All answers and tables will be removed. This cannot be undone.</p><button class="btn red" data-act="tDel">Delete</button><button class="btn ghost" data-act="mClose">Cancel</button>`); return; }
  if(a==='tDel'){ closeModal(); if(TREF) TREF.remove().then(()=>{ lsDel('fm_tcode'); TCODE=null; TDATA=null; renderTeacher(); }); return; }
  if(a==='mClose'){ closeModal(); return; }
}

/* ============ START ============ */
async function boot(){
  if(location.hash==='#teacher'){ renderTeacher(); return; }
  renderHome('');
  if(lsGet(SESS)&&FB_OK){ const ok=await resumeSaved(); if(!ok) renderHome(''); }
}
boot();
window.addEventListener('hashchange',()=>{ location.reload(); });

</script>
